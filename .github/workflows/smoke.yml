name: Predictor smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  predictor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check app syntax and model artifacts
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import joblib
          import xgboost as xgb

          scaler = joblib.load("scaler.joblib")
          model = xgb.Booster()
          model.load_model("model.bst")
          print(f"Current model features: {model.num_features()}, current scaler features: {scaler.n_features_in_}")
          import subprocess
          subprocess.run(
              ["git", "show", "75cc42ca113648940c87a5eda24f017c76867294:scaler.joblib"],
              check=True,
              stdout=open("/tmp/previous_scaler.joblib", "wb"),
          )
          previous_scaler = joblib.load("/tmp/previous_scaler.joblib")
          print(f"Previous scaler features: {previous_scaler.n_features_in_}")
          if model.num_features() != scaler.n_features_in_:
              raise SystemExit("Model and scaler feature counts do not match")
          PY
