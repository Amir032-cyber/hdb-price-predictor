name: Predictor smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  predictor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check app syntax and model artifacts
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import joblib
          import xgboost as xgb

          scaler = joblib.load("scaler.joblib")
          model = xgb.Booster()
          model.load_model("model.bst")
          print(f"Model features: {model.num_features()}, scaler features: {scaler.n_features_in_}")
          print(f"Model feature names: {model.feature_names}")
          if model.num_features() != scaler.n_features_in_:
              raise SystemExit("Model and scaler feature counts do not match")
          PY
