name: Predictor smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  predictor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check app and run an artifact prediction
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          import joblib
          import numpy as np
          import xgboost as xgb

          app = ast.parse(open("app.py", encoding="utf-8").read())
          features = next(
              ast.literal_eval(node.value)
              for node in app.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "FEATURE_NAMES" for target in node.targets)
          )
          scaler = joblib.load("scaler.joblib")
          model = xgb.Booster()
          model.load_model("model.bst")
          expected = len(features)
          if expected != scaler.n_features_in_ or expected != model.num_features():
              raise SystemExit(
                  f"Feature schema mismatch: app={expected}, scaler={scaler.n_features_in_}, model={model.num_features()}"
              )
          sample = scaler.transform(np.zeros((1, expected), dtype=np.float32))
          prediction = model.predict(xgb.DMatrix(sample, feature_names=features))
          if prediction.size != 1 or not np.isfinite(prediction[0]):
              raise SystemExit("Model returned an invalid prediction")
          print(f"Artifact smoke prediction succeeded with {expected} features")
          PY
